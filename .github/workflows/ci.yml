name: Build and Release rpi-suspend

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: |
          python3 -m py_compile pkg/usr/bin/rpi-suspend

      - name: Validate Shell scripts and Profiles
        run: |
          bash -n build_deb.sh
          sh -n pkg/DEBIAN/postinst
          sh -n pkg/DEBIAN/prerm
          sh -n pkg/DEBIAN/postrm
          for conf in pkg/etc/rpi-suspend.conf pkg/usr/share/rpi-suspend/profiles/*.conf; do
            echo "Checking $conf..."
            bash -n "$conf"
          done

      - name: Build Debian Package
        run: |
          chmod +x build_deb.sh
          ./build_deb.sh

      - name: Verify Debian Package Contents
        run: |
          dpkg-deb --info rpi-suspend.deb
          dpkg-deb --contents rpi-suspend.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpi-suspend-deb
          path: |
            rpi-suspend_*.deb
            rpi-suspend.deb

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rpi-suspend_*.deb
            rpi-suspend.deb
          generate_release_notes: true
