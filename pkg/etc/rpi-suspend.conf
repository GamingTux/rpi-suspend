# /etc/rpi-suspend.conf
# Configuration for rpi-suspend (Universal Raspberry Pi Userspace Suspend & Clamshell Manager)
#
# Settings are loaded in the following priority order:
#   1. Built-in defaults
#   2. Selected hardware profile (/usr/share/rpi-suspend/profiles/<PROFILE>.conf)
#   3. Active (uncommented) settings in this file (/etc/rpi-suspend.conf)
#   4. Drop-in files in /etc/rpi-suspend.conf.d/*.conf
#
# Run 'rpi-suspend profiles' to list available profiles or
# 'sudo rpi-suspend set-profile <name>' to switch profiles.

PROFILE="generic"

# --- Core Power-Saving Features (uncomment to override profile defaults) ---
# ENABLE_CGROUP_FREEZE=true
# ENABLE_CPU_PARKING=true
# ENABLE_CPU_POWERSAVE=true
# ENABLE_DISPLAY_DPMS=true
# ENABLE_FAN_CONTROL=true
# FAN_WATCHDOG_TEMP_MC=68000
# ENABLE_AUDIO_MUTE=true
# ENABLE_MPRIS_PAUSE=true
# ENABLE_LOCK_SCREEN=true
# ENABLE_AUDIO_AUTOSUSPEND=true
# SUSPEND_WIFI_POWERSAVE=true
# SUSPEND_BLUETOOTH_BLOCK=false
# ENABLE_KBD_BACKLIGHT=true

# --- Wakeup Sources ---
# WAKE_ON_LID=true
# WAKE_ON_KEYBOARD=true
# WAKE_ON_MOUSE=true

# --- Laptop Lid, Clamshell Mode & Battery Safety ---
# MAX_BATTERY_LOSS_PERCENT=10
# ENABLE_CLAMSHELL_MODE=true
# DISABLE_KEYBOARD_IN_SLEEP=always
# INTERNAL_DISPLAY="eDP-* LVDS-* DSI-*"

# --- Hardware Quirks ---
# Space-separated sysfs paths to power down during sleep and clamshell mode:
# CUSTOM_POWER_CUT_PATHS=""
# CUSTOM_USBHID_UNBIND=""
