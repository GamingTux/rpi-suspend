# Argon ONE UP (Raspberry Pi Compute Module 5 Laptop)
# - Internal BOE 1920x1200 panel is connected to HDMI-A-2 (hdmi1) or eDP-1 (with kernel patch)
# - External HDMI port on the chassis side is HDMI-A-1 (hdmi0)
# - Internal AMIRA keyboard & backlight LEDs sit on USB hub ports 1-1-port6 & 1-1-port7
# - Internal C-Media audio chip exposes an unpopulated HID endpoint on 1-1.1:1.3
INTERNAL_DISPLAY="eDP-1 HDMI-A-2"
ENABLE_CLAMSHELL_MODE=true
DISABLE_KEYBOARD_IN_SLEEP=always
CUSTOM_POWER_CUT_PATHS="/sys/bus/usb/devices/1-1:1.0/1-1-port[67]/disable"
CUSTOM_USBHID_UNBIND="1-1.1:1.3"
MAX_BATTERY_LOSS_PERCENT=10
